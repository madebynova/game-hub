<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- RUNOUT cover (3:4). Original artwork: the rung house up close, someone at
       the door with a torch, and the runner heading for the van. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060e"/>
      <stop offset="0.35" stop-color="#0a142d"/>
      <stop offset="0.55" stop-color="#16254a"/>
      <stop offset="1" stop-color="#1c2d52"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#b9ccff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#b9ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffcf78" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#ffa040" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffa040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool">
      <stop offset="0" stop-color="#a9cdff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#6f9ce8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6f9ce8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tail">
      <stop offset="0" stop-color="#ff5468" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5468" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="296" y1="540" x2="200" y2="700">
      <stop offset="0" stop-color="#fff1c9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff1c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5ea8" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3b5ea8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b5ea8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <g id="runner" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 -70 L0 -36" stroke-width="22"/>
      <path d="M10 -64 L32 -48 L44 -58" stroke-width="9"/>
      <path d="M8 -64 L-10 -52 L-22 -60" stroke-width="9"/>
      <path d="M0 -36 L22 -22 L30 0 L40 0" stroke-width="11"/>
      <path d="M0 -36 L-16 -18 L-38 -12" stroke-width="11"/>
      <circle cx="17" cy="-86" r="0.5" stroke-width="23"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="600" height="800" fill="url(#sky)"/>
  <g fill="#dfe7ff">
    <circle cx="48" cy="60" r="1.5" opacity="0.7"/>
    <circle cx="140" cy="140" r="1.1" opacity="0.5"/>
    <circle cx="232" cy="46" r="1.4" opacity="0.6"/>
    <circle cx="300" cy="170" r="1" opacity="0.4"/>
    <circle cx="352" cy="92" r="1.7" opacity="0.7"/>
    <circle cx="570" cy="40" r="1.2" opacity="0.5"/>
    <circle cx="560" cy="210" r="1.1" opacity="0.4"/>
    <circle cx="84" cy="230" r="1.2" opacity="0.4"/>
    <circle cx="190" cy="250" r="1" opacity="0.3"/>
  </g>
  <circle cx="455" cy="120" r="130" fill="url(#moonGlow)"/>
  <circle cx="455" cy="120" r="30" fill="#e6ecfb"/>
  <circle cx="446" cy="112" r="5.5" fill="#ccd5ea" opacity="0.6"/>
  <circle cx="465" cy="133" r="4" fill="#ccd5ea" opacity="0.5"/>
  <ellipse cx="420" cy="144" rx="90" ry="11" fill="#0d1733" opacity="0.75"/>

  <!-- Overhead wires -->
  <path d="M0 300 Q300 360 600 280" fill="none" stroke="#070b16" stroke-width="2"/>
  <path d="M0 316 Q300 378 600 298" fill="none" stroke="#070b16" stroke-width="1.5"/>

  <!-- Distant trees -->
  <path d="M0 420 Q40 380 90 404 Q140 360 200 396 L420 396 Q470 350 530 388 Q570 366 600 380 L600 470 L0 470 Z" fill="#0a1226"/>
  <rect y="330" width="600" height="220" fill="url(#haze)"/>

  <!-- Neighbours, cut off by the frame -->
  <rect x="-40" y="430" width="85" height="160" fill="#1e2538"/>
  <polygon points="-60,435 0,390 64,435" fill="#0f1423"/>
  <rect x="0" y="480" width="34" height="46" fill="#0f1420"/>
  <rect x="555" y="420" width="85" height="170" fill="#1e2538"/>
  <polygon points="538,425 640,350 640,425" fill="#0f1423"/>
  <circle cx="600" cy="495" r="50" fill="url(#warm)" opacity="0.7"/>
  <rect x="580" y="470" width="40" height="50" fill="#e9b863"/>

  <!-- The rung house -->
  <rect x="90" y="360" width="420" height="230" fill="#252d43"/>
  <polygon points="60,366 300,215 540,366" fill="#121727"/>
  <polyline points="60,366 300,215 540,366" fill="none" stroke="#34416a" stroke-width="3"/>
  <circle cx="300" cy="289" r="75" fill="url(#warm)" opacity="0.7"/>
  <rect x="270" y="265" width="60" height="48" fill="#e9b863"/>
  <rect x="298" y="265" width="4" height="48" fill="#7a5522"/>
  <circle cx="172" cy="470" r="110" fill="url(#warm)"/>
  <rect x="125" y="430" width="95" height="80" fill="#fcd77f"/>
  <rect x="170" y="430" width="4" height="80" fill="#8a6428"/>
  <rect x="125" y="468" width="95" height="4" fill="#8a6428"/>
  <rect x="380" y="430" width="95" height="80" fill="#0f1420"/>
  <rect x="386" y="436" width="36" height="68" fill="#1b2542" opacity="0.6"/>
  <circle cx="320" cy="530" r="220" fill="url(#warm)"/>
  <rect x="275" y="490" width="52" height="100" fill="#ffdb8f"/>
  <path d="M288 590 L288 534 Q301 516 314 534 L314 590 Z" fill="#20160a"/>
  <circle cx="301" cy="512" r="10" fill="#20160a"/>
  <polygon points="252,474 350,474 364,488 238,488" fill="#161b2b"/>
  <circle cx="352" cy="498" r="5" fill="#fff0c2"/>

  <!-- Lawn, walkway, hedges -->
  <rect y="590" width="600" height="70" fill="#0b1513"/>
  <polygon points="278,590 324,590 360,660 242,660" fill="#1d2230"/>
  <polygon points="278,590 324,590 360,660 242,660" fill="url(#warm)" opacity="0.5"/>
  <g fill="#10241a">
    <rect x="-20" y="622" width="245" height="38" rx="18"/>
    <rect x="378" y="622" width="240" height="38" rx="18"/>
  </g>
  <g fill="#173522" opacity="0.8">
    <rect x="-10" y="622" width="225" height="10" rx="5"/>
    <rect x="388" y="622" width="220" height="10" rx="5"/>
  </g>

  <!-- Sidewalk, kerb, road -->
  <rect y="660" width="600" height="40" fill="#1c212c"/>
  <g stroke="#151922" stroke-width="2">
    <line x1="120" y1="660" x2="120" y2="700"/>
    <line x1="300" y1="660" x2="300" y2="700"/>
    <line x1="480" y1="660" x2="480" y2="700"/>
  </g>
  <rect y="700" width="600" height="10" fill="#282e3b"/>
  <rect y="710" width="600" height="90" fill="#12151d"/>
  <line x1="0" y1="770" x2="600" y2="770" stroke="#2a3142" stroke-width="5" stroke-dasharray="60 48"/>

  <!-- Street lamp -->
  <ellipse cx="505" cy="690" rx="120" ry="28" fill="url(#cool)"/>
  <circle cx="500" cy="442" r="90" fill="url(#cool)" opacity="0.8"/>
  <rect x="538" y="436" width="7" height="262" fill="#0a0e17"/>
  <path d="M541 440 Q530 428 506 434" fill="none" stroke="#0a0e17" stroke-width="6"/>
  <path d="M486 432 L514 432 L508 442 L492 442 Z" fill="#151a26"/>
  <ellipse cx="500" cy="443" rx="9" ry="3" fill="#e2efff"/>

  <!-- Flashlight from the doorway -->
  <polygon points="306,528 316,538 320,710 96,672" fill="url(#beam)"/>

  <!-- The van, parked at the kerb -->
  <ellipse cx="30" cy="786" rx="110" ry="10" fill="#000" opacity="0.45"/>
  <path d="M-60 770 L-60 666 L90 666 Q104 666 104 680 L104 770 Z" fill="#242b3c"/>
  <path d="M-60 666 L90 666" stroke="#3d4866" stroke-width="3"/>
  <rect x="30" y="678" width="58" height="36" rx="3" fill="#0c111b"/>
  <rect x="-60" y="736" width="164" height="5" fill="#7dd3fc" opacity="0.85"/>
  <circle cx="104" cy="706" r="40" fill="url(#tail)"/>
  <rect x="96" y="692" width="8" height="26" rx="2" fill="#ff5a6a"/>
  <circle cx="44" cy="772" r="24" fill="#06080d"/>
  <circle cx="44" cy="772" r="9" fill="#2b3142"/>

  <!-- The runner, making for the van -->
  <ellipse cx="206" cy="704" rx="52" ry="7" fill="#000" opacity="0.5"/>
  <use href="#runner" transform="translate(212 702) scale(-1.45 1.45)" stroke="#ffb458" opacity="0.45" filter="url(#soft)"/>
  <use href="#runner" transform="translate(212 702) scale(-1.45 1.45)" stroke="#03050a"/>

  <rect width="600" height="800" fill="url(#vignette)"/>
</svg>
