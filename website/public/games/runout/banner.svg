<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- RUNOUT banner (16:9). Original artwork: a suburban street at night, one
       porch lit, someone in the doorway, and a runner making for the van. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060e"/>
      <stop offset="0.4" stop-color="#0a142d"/>
      <stop offset="0.62" stop-color="#16254a"/>
      <stop offset="1" stop-color="#1c2d52"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#b9ccff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#b9ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffcf78" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#ffa040" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffa040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool">
      <stop offset="0" stop-color="#a9cdff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#6f9ce8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6f9ce8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tv">
      <stop offset="0" stop-color="#6d95e6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d95e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tail">
      <stop offset="0" stop-color="#ff5468" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5468" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="722" y1="604" x2="1010" y2="770">
      <stop offset="0" stop-color="#fff1c9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff1c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5ea8" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3b5ea8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b5ea8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="runner" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 -70 L0 -36" stroke-width="22"/>
      <path d="M10 -64 L32 -48 L44 -58" stroke-width="9"/>
      <path d="M8 -64 L-10 -52 L-22 -60" stroke-width="9"/>
      <path d="M0 -36 L22 -22 L30 0 L40 0" stroke-width="11"/>
      <path d="M0 -36 L-16 -18 L-38 -12" stroke-width="11"/>
      <circle cx="17" cy="-86" r="0.5" stroke-width="23"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#dfe7ff">
    <circle cx="96" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="210" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="330" cy="54" r="1.4" opacity="0.6"/>
    <circle cx="452" cy="220" r="1.1" opacity="0.4"/>
    <circle cx="560" cy="110" r="1.8" opacity="0.7"/>
    <circle cx="690" cy="40" r="1.2" opacity="0.5"/>
    <circle cx="812" cy="180" r="1.4" opacity="0.5"/>
    <circle cx="930" cy="84" r="1.1" opacity="0.6"/>
    <circle cx="1040" cy="236" r="1.3" opacity="0.4"/>
    <circle cx="1120" cy="46" r="1.6" opacity="0.7"/>
    <circle cx="1230" cy="260" r="1.1" opacity="0.4"/>
    <circle cx="1510" cy="92" r="1.4" opacity="0.6"/>
    <circle cx="1560" cy="240" r="1.2" opacity="0.4"/>
    <circle cx="150" cy="290" r="1.1" opacity="0.35"/>
    <circle cx="640" cy="280" r="1" opacity="0.3"/>
  </g>
  <circle cx="1380" cy="150" r="170" fill="url(#moonGlow)"/>
  <circle cx="1380" cy="150" r="38" fill="#e6ecfb"/>
  <circle cx="1368" cy="140" r="7" fill="#ccd5ea" opacity="0.6"/>
  <circle cx="1392" cy="166" r="5" fill="#ccd5ea" opacity="0.5"/>
  <ellipse cx="1330" cy="178" rx="120" ry="14" fill="#0d1733" opacity="0.75"/>
  <ellipse cx="1440" cy="190" rx="90" ry="9" fill="#0d1733" opacity="0.6"/>

  <!-- Overhead wires -->
  <path d="M0 250 Q480 330 980 262 T1600 300" fill="none" stroke="#070b16" stroke-width="2"/>
  <path d="M0 268 Q480 350 980 282 T1600 322" fill="none" stroke="#070b16" stroke-width="1.5"/>

  <!-- Distant tree line -->
  <path d="M0 520 Q40 470 90 500 Q130 450 190 486 Q240 440 300 480 Q360 450 420 492 Q470 460 520 500 L520 560 L0 560 Z
           M880 500 Q930 452 990 486 Q1040 440 1100 474 Q1160 446 1210 480 Q1260 430 1330 470 Q1390 440 1440 468 Q1500 430 1560 462 Q1590 450 1600 456 L1600 560 L880 560 Z"
        fill="#0a1226"/>
  <rect y="430" width="1600" height="240" fill="url(#haze)"/>

  <!-- House A -->
  <rect x="60" y="480" width="320" height="170" fill="#222a3e"/>
  <polygon points="40,485 220,370 400,485" fill="#111626"/>
  <polyline points="40,485 220,370 400,485" fill="none" stroke="#2f3b5c" stroke-width="3"/>
  <rect x="100" y="540" width="70" height="60" fill="#0f1420"/>
  <rect x="104" y="544" width="28" height="52" fill="#1a2440" opacity="0.6"/>
  <circle cx="305" cy="570" r="80" fill="url(#warm)"/>
  <rect x="270" y="540" width="70" height="60" fill="#fcd77f"/>
  <rect x="303" y="540" width="4" height="60" fill="#8a6428"/>
  <rect x="200" y="580" width="40" height="70" fill="#121724"/>

  <!-- House B: the one that just got rung -->
  <rect x="520" y="440" width="380" height="210" fill="#252d43"/>
  <polygon points="500,445 710,318 920,445" fill="#121727"/>
  <polyline points="500,445 710,318 920,445" fill="none" stroke="#34416a" stroke-width="3"/>
  <circle cx="710" cy="406" r="70" fill="url(#warm)" opacity="0.7"/>
  <rect x="685" y="385" width="50" height="40" fill="#e9b863"/>
  <rect x="708" y="385" width="4" height="40" fill="#7a5522"/>
  <circle cx="605" cy="555" r="95" fill="url(#warm)"/>
  <rect x="560" y="520" width="90" height="70" fill="#fcd77f"/>
  <rect x="603" y="520" width="4" height="70" fill="#8a6428"/>
  <rect x="560" y="553" width="90" height="4" fill="#8a6428"/>
  <rect x="790" y="520" width="80" height="70" fill="#0f1420"/>
  <rect x="795" y="525" width="30" height="60" fill="#1b2542" opacity="0.6"/>
  <circle cx="735" cy="590" r="210" fill="url(#warm)"/>
  <rect x="688" y="572" width="44" height="78" fill="#ffdb8f"/>
  <path d="M699 650 L699 606 Q710 592 721 606 L721 650 Z" fill="#20160a"/>
  <circle cx="710" cy="588" r="8" fill="#20160a"/>
  <polygon points="670,558 750,558 762,570 658,570" fill="#161b2b"/>
  <circle cx="752" cy="578" r="5" fill="#fff0c2"/>

  <!-- House C -->
  <rect x="1030" y="490" width="300" height="160" fill="#20283b"/>
  <polygon points="1010,495 1180,395 1350,495" fill="#101524"/>
  <polyline points="1010,495 1180,395 1350,495" fill="none" stroke="#2c3857" stroke-width="3"/>
  <rect x="1160" y="440" width="40" height="34" fill="#0f1420"/>
  <circle cx="1105" cy="572" r="75" fill="url(#warm)" opacity="0.8"/>
  <rect x="1070" y="545" width="70" height="55" fill="#f4c96e"/>
  <rect x="1103" y="545" width="4" height="55" fill="#80602a"/>
  <rect x="1230" y="545" width="70" height="55" fill="#0f1420"/>

  <!-- House D, cut off by the frame -->
  <rect x="1440" y="470" width="200" height="180" fill="#1e2538"/>
  <polygon points="1420,475 1580,370 1660,420 1660,475" fill="#0f1423"/>
  <polyline points="1420,475 1580,370 1660,420" fill="none" stroke="#2a3554" stroke-width="3"/>
  <circle cx="1510" cy="560" r="70" fill="url(#tv)"/>
  <rect x="1480" y="530" width="60" height="60" fill="#233462"/>
  <rect x="1480" y="530" width="60" height="60" fill="#6d95e6" opacity="0.35"/>

  <!-- Lawns, walkway, mailbox, hedges -->
  <rect y="650" width="1600" height="70" fill="#0b1513"/>
  <polygon points="690,650 730,650 770,720 650,720" fill="#1d2230"/>
  <polygon points="690,650 730,650 770,720 650,720" fill="url(#warm)" opacity="0.5"/>
  <rect x="628" y="672" width="5" height="36" fill="#0a0d14"/>
  <rect x="618" y="662" width="26" height="14" rx="4" fill="#161b27"/>
  <g fill="#10241a">
    <rect x="30" y="676" width="190" height="40" rx="18"/>
    <rect x="250" y="682" width="140" height="34" rx="16"/>
    <rect x="800" y="676" width="210" height="40" rx="18"/>
    <rect x="1040" y="680" width="160" height="36" rx="16"/>
    <rect x="1370" y="678" width="230" height="38" rx="18"/>
  </g>
  <g fill="#173522" opacity="0.8">
    <rect x="40" y="676" width="170" height="10" rx="5"/>
    <rect x="260" y="682" width="120" height="9" rx="5"/>
    <rect x="810" y="676" width="190" height="10" rx="5"/>
    <rect x="1050" y="680" width="140" height="9" rx="5"/>
    <rect x="1380" y="678" width="210" height="10" rx="5"/>
  </g>

  <!-- Sidewalk, kerb, road -->
  <rect y="720" width="1600" height="32" fill="#1c212c"/>
  <g stroke="#151922" stroke-width="2">
    <line x1="90" y1="720" x2="90" y2="752"/>
    <line x1="270" y1="720" x2="270" y2="752"/>
    <line x1="450" y1="720" x2="450" y2="752"/>
    <line x1="630" y1="720" x2="630" y2="752"/>
    <line x1="810" y1="720" x2="810" y2="752"/>
    <line x1="990" y1="720" x2="990" y2="752"/>
    <line x1="1170" y1="720" x2="1170" y2="752"/>
    <line x1="1350" y1="720" x2="1350" y2="752"/>
    <line x1="1530" y1="720" x2="1530" y2="752"/>
  </g>
  <rect y="752" width="1600" height="10" fill="#282e3b"/>
  <rect y="762" width="1600" height="138" fill="#12151d"/>
  <line x1="0" y1="850" x2="1600" y2="850" stroke="#2a3142" stroke-width="5" stroke-dasharray="70 55"/>

  <!-- Street lamp -->
  <ellipse cx="480" cy="738" rx="190" ry="36" fill="url(#cool)"/>
  <circle cx="494" cy="476" r="110" fill="url(#cool)" opacity="0.8"/>
  <rect x="456" y="470" width="7" height="275" fill="#0a0e17"/>
  <path d="M459 474 Q470 462 494 468" fill="none" stroke="#0a0e17" stroke-width="6"/>
  <path d="M480 466 L508 466 L502 476 L486 476 Z" fill="#151a26"/>
  <ellipse cx="494" cy="477" rx="9" ry="3" fill="#e2efff"/>

  <!-- Flashlight from the doorway, sweeping after the runner -->
  <polygon points="716,598 728,606 1120,790 880,800" fill="url(#beam)"/>

  <!-- The van -->
  <ellipse cx="1360" cy="845" rx="190" ry="14" fill="#000" opacity="0.45"/>
  <path d="M1200 812 L1200 745 Q1204 716 1236 700 L1500 700 Q1520 700 1520 720 L1520 812 Z" fill="#242b3c"/>
  <path d="M1236 700 L1500 700" stroke="#3d4866" stroke-width="3"/>
  <path d="M1212 750 Q1218 722 1242 712 L1290 712 L1290 752 Z" fill="#0c111b"/>
  <rect x="1320" y="714" width="130" height="36" rx="3" fill="#0c111b"/>
  <rect x="1200" y="772" width="320" height="6" fill="#7dd3fc" opacity="0.85"/>
  <circle cx="1522" cy="740" r="46" fill="url(#tail)"/>
  <rect x="1512" y="726" width="8" height="26" rx="2" fill="#ff5a6a"/>
  <rect x="1202" y="782" width="14" height="10" rx="2" fill="#c9dcf2" opacity="0.6"/>
  <circle cx="1272" cy="816" r="28" fill="#06080d"/>
  <circle cx="1272" cy="816" r="11" fill="#2b3142"/>
  <circle cx="1452" cy="816" r="28" fill="#06080d"/>
  <circle cx="1452" cy="816" r="11" fill="#2b3142"/>

  <!-- The runner -->
  <ellipse cx="1040" cy="750" rx="40" ry="6" fill="#000" opacity="0.5"/>
  <use href="#runner" transform="translate(1036 748)" stroke="#ffb458" opacity="0.45" filter="url(#soft)"/>
  <use href="#runner" transform="translate(1036 748)" stroke="#03050a"/>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
