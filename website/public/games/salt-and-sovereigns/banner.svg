    <circle cx="190" cy="120" r="1" opacity="0.5"/>
    <circle cx="330" cy="40" r="1.6" opacity="0.6"/>
    <circle cx="470" cy="150" r="1" opacity="0.4"/>
    <circle cx="610" cy="70" r="1.4" opacity="0.6"/>
    <circle cx="760" cy="30" r="1.1" opacity="0.5"/>
    <circle cx="905" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="1040" cy="44" r="1.2" opacity="0.5"/>
    <circle cx="1190" cy="140" r="1" opacity="0.4"/>
    <circle cx="1330" cy="60" r="1.6" opacity="0.65"/>
    <circle cx="1470" cy="120" r="1.1" opacity="0.45"/>
