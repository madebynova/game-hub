  <circle cx="760" cy="552" r="72" fill="url(#sunDisc)"/>
  <path d="M520 526 Q680 514 860 520 Q980 516 1060 526 L1060 533 Q960 529 860 533 Q680 536 520 533 Z" fill="#9a4a50" opacity="0.55"/>

