    <path d="M1494 496 Q1482 490 1470 494 M1494 496 Q1506 488 1518 494 M1494 496 Q1490 484 1480 482 M1494 496 Q1500 482 1510 480" stroke-width="1.8"/>
  </g>
  <path d="M-10 561 L-10 470 Q40 440 90 452 Q140 400 200 418 Q240 392 290 420 Q340 430 380 470 Q420 500 470 530 Q500 548 540 561 Z" fill="#2c1c34"/>
  <g stroke="#221529" stroke-linecap="round" fill="none">
    <path d="M150 412 Q148 392 154 376" stroke-width="2.4"/>
    <path d="M154 376 Q142 370 130 374 M154 376 Q166 368 178 374 M154 376 Q150 364 140 362 M154 376 Q160 362 170 360" stroke-width="1.8"/>
    <path d="M244 404 Q243 388 248 376" stroke-width="2"/>
    <path d="M248 376 Q238 371 228 374 M248 376 Q258 369 268 374 M248 376 Q245 366 237 364" stroke-width="1.6"/>
  </g>
  <path d="M-10 561 L-10 508 Q80 492 170 504 Q260 498 340 528 L400 561 Z" fill="#22162a"/>

