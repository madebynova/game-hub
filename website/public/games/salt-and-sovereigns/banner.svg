  <ellipse cx="770" cy="561" rx="520" ry="2.6" fill="#ffe3b0" opacity="0.75"/>
  <g fill="#ffd9a0">
    <rect x="650" y="566" width="220" height="4" rx="2" opacity="0.85"/>
    <rect x="700" y="576" width="130" height="4" rx="2" opacity="0.7"/>
    <rect x="620" y="588" width="120" height="4" rx="2" opacity="0.6"/>
    <rect x="756" y="588" width="126" height="4" rx="2" opacity="0.55"/>
    <rect x="712" y="602" width="120" height="5" rx="2.5" opacity="0.55"/>
    <rect x="600" y="618" width="130" height="5" rx="2.5" opacity="0.45"/>
    <rect x="748" y="618" width="152" height="5" rx="2.5" opacity="0.42"/>
    <rect x="690" y="636" width="170" height="5" rx="2.5" opacity="0.4"/>
    <rect x="580" y="658" width="340" height="6" rx="3" opacity="0.32"/>
    <rect x="672" y="684" width="200" height="6" rx="3" opacity="0.27"/>
    <rect x="560" y="714" width="170" height="7" rx="3.5" opacity="0.22"/>
    <rect x="750" y="714" width="190" height="7" rx="3.5" opacity="0.2"/>
    <rect x="660" y="748" width="230" height="7" rx="3.5" opacity="0.17"/>
    <rect x="540" y="790" width="420" height="8" rx="4" opacity="0.13"/>
    <rect x="640" y="836" width="260" height="8" rx="4" opacity="0.1"/>
    <rect x="520" y="880" width="200" height="9" rx="4.5" opacity="0.07"/>
    <rect x="750" y="880" width="230" height="9" rx="4.5" opacity="0.07"/>
