    <path d="M980 584 Q1160 578 1340 584 T1700 583" stroke="#e8a070" stroke-opacity="0.25" stroke-width="1.6" stroke-dasharray="36 22 10 26"/>
    <path d="M-10 590 Q220 582 460 590" stroke="#e8a070" stroke-opacity="0.2" stroke-width="1.6" stroke-dasharray="30 24"/>
    <path d="M920 630 Q1120 620 1320 630 T1720 630" stroke="#9a6a78" stroke-opacity="0.3" stroke-width="2.2" stroke-dasharray="54 30 16 34"/>
    <path d="M-20 650 Q180 638 380 650 T780 650" stroke="#6a5a7a" stroke-opacity="0.3" stroke-width="2.2" stroke-dasharray="60 34"/>
    <path d="M-20 730 Q240 716 500 730 T1020 730" stroke="#4a6488" stroke-opacity="0.32" stroke-width="2.8" stroke-dasharray="80 40 24 50"/>
    <path d="M300 800 Q600 784 900 800 T1500 800 T2100 800" stroke="#3c577c" stroke-opacity="0.35" stroke-width="3.2" stroke-dasharray="110 50 30 60"/>
