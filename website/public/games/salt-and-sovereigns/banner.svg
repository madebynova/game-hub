    <path d="M1340 714 Q1376 724 1402 740" stroke-opacity="0.5" stroke-width="2.6"/>
    <path d="M1300 730 Q1370 740 1440 743" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M860 742 Q920 750 980 745" stroke-opacity="0.2" stroke-width="2"/>
