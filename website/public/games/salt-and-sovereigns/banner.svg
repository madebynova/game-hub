        <path d="M-6 -372 L104 -318"/>
        <path d="M104 -318 L290 -118"/>
        <path d="M-116 -282 L-6 -300"/>
        <path d="M-6 -300 L-60 -54 M-6 -300 L40 -52"/>
        <path d="M104 -250 L70 -52 M104 -250 L140 -56"/>
        <path d="M-116 -230 L-150 -80"/>
      </g>
      <path d="M-182 -78 L-128 -82 Q-96 -56 -40 -52 L74 -50 Q118 -54 150 -66 L196 -76 Q184 -40 150 -4 Q112 12 10 14 L-118 12 Q-162 6 -172 -26 Z" fill="#1a0f14"/>
      <path d="M-182 -78 L-128 -82 Q-96 -56 -40 -52" fill="none" stroke="#ff9e5e" stroke-width="2" stroke-opacity="0.55"/>
      <path d="M-176 -44 Q-60 -30 164 -36" fill="none" stroke="#6b3a2c" stroke-width="3"/>
      <path d="M-166 -18 Q-40 -4 150 -12" fill="none" stroke="#3f241e" stroke-width="2"/>
      <g fill="#0a0608">
