  <!-- Gulls -->
  <g fill="none" stroke="#1c1428" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1310 250 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M1360 282 q6 -6 12 0 q6 -6 12 0" stroke-width="2.1"/>
    <path d="M960 240 q5 -5 10 0 q5 -5 10 0" stroke-width="1.8"/>
