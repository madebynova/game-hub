  <path d="M1300 561 Q1330 544 1370 546 Q1410 522 1460 532 Q1510 522 1550 540 Q1590 546 1620 561 Z" fill="#4a2b46" opacity="0.85"/>
  <g stroke="#3d233c" stroke-linecap="round" fill="none">
