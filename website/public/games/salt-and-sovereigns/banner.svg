  <path d="M880 196 Q1000 176 1140 188 Q1280 176 1420 190 Q1520 184 1620 196 L1620 214 Q1500 208 1400 216 Q1260 224 1120 214 Q990 222 880 212 Q840 204 880 196 Z" fill="#26264a" opacity="0.9"/>
  <path d="M900 212 Q1000 218 1120 212 Q1260 222 1400 214 Q1500 206 1620 212 L1620 220 Q1500 216 1400 224 Q1260 230 1120 220 Q1000 226 900 216 Z" fill="#9a5064" opacity="0.45"/>
  <path d="M-20 330 Q200 306 440 320 Q700 300 960 322 Q1200 308 1420 326 Q1520 320 1620 332 L1620 350 Q1500 344 1400 352 Q1180 362 950 348 Q700 360 430 346 Q200 358 -20 348 Z" fill="#3a2a4e" opacity="0.85"/>
  <path d="M-20 348 Q200 358 430 346 Q700 360 950 348 Q1180 362 1400 352 Q1500 344 1620 350 L1620 360 Q1500 356 1400 362 Q1180 372 950 358 Q700 370 430 356 Q200 368 -20 358 Z" fill="#e0805e" opacity="0.4"/>
  <path d="M-20 440 Q240 420 520 432 Q820 414 1120 434 Q1360 424 1620 444 L1620 456 Q1360 450 1110 458 Q820 466 510 452 Q240 462 -20 456 Z" fill="#6a3a55" opacity="0.7"/>
  <path d="M-20 456 Q240 462 510 452 Q820 466 1110 458 Q1360 450 1620 456 L1620 462 Q1360 458 1110 466 Q820 474 510 460 Q240 470 -20 462 Z" fill="#ffae6e" opacity="0.35"/>

