  <path d="M940 724 Q1000 716 1070 723 Q1150 714 1230 723 Q1300 716 1380 722 L1380 740 L940 740 Z" fill="url(#sea)"/>
  <g fill="none" stroke="#f6dcb8" stroke-linecap="round">
