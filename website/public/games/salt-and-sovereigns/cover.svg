<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Salt & Sovereigns cover (3:4). Original artwork: a pirate ship under full
       sail crossing open water at sunset, islands on the horizon. -->
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="500">
      <stop offset="0" stop-color="#060f24"/>
      <stop offset="0.32" stop-color="#172246"/>
      <stop offset="0.6" stop-color="#4f3056"/>
      <stop offset="0.82" stop-color="#b85a4c"/>
      <stop offset="1" stop-color="#f3a45c"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="500" x2="0" y2="800">
      <stop offset="0" stop-color="#b3604f"/>
      <stop offset="0.07" stop-color="#6b3a4f"/>
      <stop offset="0.3" stop-color="#24304c"/>
      <stop offset="0.65" stop-color="#101f38"/>
      <stop offset="1" stop-color="#060f1e"/>
    </linearGradient>
    <radialGradient id="sunDisc">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.6" stop-color="#ffdb8c"/>
      <stop offset="1" stop-color="#ffb45a"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffc56e" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ff9a52" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff9a52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sailLit" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffe6b8"/>
      <stop offset="0.5" stop-color="#e9ae78"/>
      <stop offset="1" stop-color="#8e5048"/>
    </linearGradient>
    <linearGradient id="sailShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c22" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a1c22" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="reflectMask" maskUnits="userSpaceOnUse" x="0" y="612" width="600" height="188">
      <rect x="0" y="612" width="600" height="188" fill="url(#fade)"/>
    </mask>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Sail shapes, unfilled, so they can be painted twice: lit, then shaded. -->
    <g id="sails">
      <path d="M106 -296 L284 -118 L184 -82 Q156 -196 106 -296 Z"/>
      <path d="M-114 -250 L-114 -94 L-192 -98 Q-172 -180 -114 -250 Z"/>
      <path d="M-86 -138 L70 -138 Q80 -104 66 -70 Q-8 -54 -82 -70 Q-96 -104 -86 -138 Z"/>
      <path d="M-72 -230 L56 -230 Q66 -192 54 -156 Q-8 -142 -70 -156 Q-82 -192 -72 -230 Z"/>
      <path d="M-54 -306 L40 -306 Q48 -276 38 -248 Q-8 -238 -52 -248 Q-62 -276 -54 -306 Z"/>
      <path d="M48 -128 L166 -128 Q174 -98 164 -70 Q106 -56 50 -70 Q40 -98 48 -128 Z"/>
      <path d="M58 -212 L154 -212 Q162 -178 152 -146 Q106 -134 60 -146 Q50 -178 58 -212 Z"/>
      <path d="M70 -280 L140 -280 Q146 -252 138 -228 Q106 -220 72 -228 Q64 -252 70 -280 Z"/>
    </g>

    <!-- The ship, waterline at y=0, bow to the right. -->
    <g id="ship">
      <g fill="#1a0f14">
        <rect x="-10" y="-372" width="8" height="322"/>
        <rect x="100" y="-318" width="7" height="268"/>
        <rect x="-119" y="-282" width="6" height="204"/>
        <rect x="-22" y="-302" width="32" height="6" rx="2"/>
      </g>
      <use href="#sails" fill="url(#sailLit)"/>
      <use href="#sails" fill="url(#sailShade)"/>
      <g stroke="#1a0f14" stroke-width="4" stroke-linecap="round">
        <line x1="-92" y1="-138" x2="76" y2="-138"/>
        <line x1="-78" y1="-230" x2="62" y2="-230"/>
        <line x1="-60" y1="-306" x2="46" y2="-306"/>
        <line x1="42" y1="-128" x2="172" y2="-128"/>
        <line x1="52" y1="-212" x2="160" y2="-212"/>
        <line x1="64" y1="-280" x2="146" y2="-280"/>
        <line x1="-196" y1="-98" x2="-110" y2="-94" stroke-width="3"/>
        <line x1="186" y1="-70" x2="290" y2="-118" stroke-width="6"/>
      </g>
      <g fill="none" stroke="#1a0f14" stroke-width="1.3" stroke-opacity="0.7">
        <path d="M-6 -372 L-182 -84"/>
        <path d="M-6 -372 L104 -318"/>
        <path d="M104 -318 L290 -118"/>
        <path d="M-116 -282 L-6 -300"/>
        <path d="M-6 -300 L-60 -54 M-6 -300 L40 -52"/>
        <path d="M104 -250 L70 -52 M104 -250 L140 -56"/>
        <path d="M-116 -230 L-150 -80"/>
      </g>
      <path d="M-182 -78 L-128 -82 Q-96 -56 -40 -52 L74 -50 Q118 -54 150 -66 L196 -76 Q184 -40 150 -4 Q112 12 10 14 L-118 12 Q-162 6 -172 -26 Z" fill="#1a0f14"/>
      <path d="M-182 -78 L-128 -82 Q-96 -56 -40 -52" fill="none" stroke="#ff9e5e" stroke-width="2" stroke-opacity="0.55"/>
      <path d="M-176 -44 Q-60 -30 164 -36" fill="none" stroke="#6b3a2c" stroke-width="3"/>
      <path d="M-166 -18 Q-40 -4 150 -12" fill="none" stroke="#3f241e" stroke-width="2"/>
      <g fill="#0a0608">
        <rect x="-130" y="-30" width="9" height="6" rx="1"/>
        <rect x="-94" y="-28" width="9" height="6" rx="1"/>
        <rect x="-58" y="-26" width="9" height="6" rx="1"/>
        <rect x="-22" y="-25" width="9" height="6" rx="1"/>
        <rect x="14" y="-25" width="9" height="6" rx="1"/>
        <rect x="50" y="-26" width="9" height="6" rx="1"/>
        <rect x="86" y="-28" width="9" height="6" rx="1"/>
      </g>
      <g fill="#ffbf6a">
        <rect x="-170" y="-68" width="6" height="7" rx="1"/>
        <rect x="-160" y="-68" width="6" height="7" rx="1"/>
        <rect x="-150" y="-67" width="6" height="7" rx="1"/>
      </g>
      <circle cx="-186" cy="-92" r="14" fill="#ffc56e" opacity="0.35"/>
      <circle cx="-186" cy="-92" r="4" fill="#ffe2a0"/>
      <path d="M-2 -372 L44 -366 Q36 -356 48 -346 L-2 -350 Z" fill="#0b0709"/>
      <circle cx="18" cy="-361" r="3.2" fill="#e8dcc8"/>
      <path d="M11 -355 L25 -350 M25 -355 L11 -350" stroke="#e8dcc8" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M104 -318 L132 -314 L104 -310 Z" fill="#b33a2e"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="600" height="520" fill="url(#sky)"/>
  <g fill="#f2e8ff">
    <circle cx="40" cy="44" r="1.3" opacity="0.7"/>
    <circle cx="118" cy="98" r="1" opacity="0.5"/>
    <circle cx="210" cy="36" r="1.5" opacity="0.6"/>
    <circle cx="300" cy="120" r="1" opacity="0.4"/>
    <circle cx="388" cy="58" r="1.4" opacity="0.6"/>
    <circle cx="470" cy="24" r="1.1" opacity="0.5"/>
    <circle cx="548" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="582" cy="170" r="1" opacity="0.35"/>
    <circle cx="72" cy="176" r="1" opacity="0.35"/>
    <circle cx="250" cy="200" r="0.9" opacity="0.3"/>
  </g>
  <circle cx="178" cy="492" r="300" fill="url(#sunGlow)"/>

  <!-- Clouds, lit from below -->
  <path d="M330 176 Q400 160 486 170 Q548 162 620 174 L620 190 Q540 186 470 194 Q400 198 330 190 Q300 184 330 176 Z" fill="#26264a" opacity="0.9"/>
  <path d="M350 190 Q420 186 480 192 Q550 188 620 190 L620 196 Q540 196 470 200 Q410 202 350 194 Z" fill="#9a5064" opacity="0.45"/>
  <path d="M-20 290 Q70 272 170 282 Q270 268 380 284 Q470 276 620 292 L620 306 Q480 300 380 310 Q260 316 160 306 Q60 314 -20 306 Z" fill="#3a2a4e" opacity="0.85"/>
  <path d="M-20 306 Q60 312 160 304 Q260 314 380 306 Q480 298 620 304 L620 312 Q480 308 380 316 Q260 322 160 314 Q60 320 -20 314 Z" fill="#e0805e" opacity="0.4"/>
  <path d="M-20 384 Q80 370 200 378 Q320 366 460 380 Q540 374 620 386 L620 396 Q520 392 440 398 Q300 404 190 394 Q80 400 -20 396 Z" fill="#6a3a55" opacity="0.7"/>
  <path d="M-20 396 Q80 400 190 394 Q300 404 440 398 Q520 392 620 396 L620 401 Q520 399 440 404 Q300 410 190 400 Q80 406 -20 401 Z" fill="#ffae6e" opacity="0.35"/>

  <!-- Sun, setting -->
  <ellipse cx="200" cy="500" rx="460" ry="110" fill="url(#sunGlow)" opacity="0.6"/>
  <circle cx="178" cy="492" r="56" fill="url(#sunDisc)"/>
  <path d="M40 470 Q150 460 280 466 Q360 462 420 470 L420 476 Q340 472 270 476 Q150 478 40 476 Z" fill="#9a4a50" opacity="0.55"/>

  <!-- Islands on the horizon -->
  <path d="M250 501 Q300 495 350 497 Q375 498 390 501 Z" fill="#5a3450" opacity="0.6"/>
  <path d="M395 501 Q420 488 446 490 Q472 472 500 480 Q528 472 548 488 Q580 490 612 501 Z" fill="#4a2b46" opacity="0.85"/>
  <g stroke="#3d233c" stroke-linecap="round" fill="none">
    <path d="M526 482 Q524 466 530 452" stroke-width="2"/>
    <path d="M530 452 Q520 446 510 450 M530 452 Q540 444 550 450 M530 452 Q526 442 518 440 M530 452 Q536 440 544 438" stroke-width="1.6"/>
  </g>
  <path d="M-10 501 L-10 462 Q12 448 34 454 Q56 430 82 440 Q104 432 122 452 Q142 468 168 501 Z" fill="#33203a"/>
  <path d="M-10 501 L-10 480 Q30 470 70 478 Q110 474 150 492 L160 501 Z" fill="#2a1a30"/>

  <!-- Sea -->
  <rect y="500" width="600" height="300" fill="url(#sea)"/>
  <ellipse cx="190" cy="501" rx="230" ry="2.2" fill="#ffe3b0" opacity="0.75"/>
  <g fill="#ffd9a0">
    <rect x="128" y="505" width="100" height="3" rx="1.5" opacity="0.85"/>
    <rect x="150" y="513" width="64" height="3" rx="1.5" opacity="0.7"/>
    <rect x="112" y="522" width="52" height="3" rx="1.5" opacity="0.6"/>
    <rect x="174" y="522" width="60" height="3" rx="1.5" opacity="0.55"/>
    <rect x="160" y="533" width="58" height="3" rx="1.5" opacity="0.55"/>
    <rect x="104" y="546" width="140" height="4" rx="2" opacity="0.45"/>
    <rect x="150" y="561" width="84" height="4" rx="2" opacity="0.4"/>
    <rect x="92" y="578" width="66" height="4" rx="2" opacity="0.32"/>
    <rect x="170" y="578" width="72" height="4" rx="2" opacity="0.3"/>
    <rect x="140" y="598" width="96" height="5" rx="2.5" opacity="0.28"/>
    <rect x="80" y="622" width="176" height="5" rx="2.5" opacity="0.22"/>
    <rect x="136" y="650" width="110" height="5" rx="2.5" opacity="0.18"/>
    <rect x="66" y="682" width="90" height="6" rx="3" opacity="0.14"/>
    <rect x="170" y="682" width="96" height="6" rx="3" opacity="0.13"/>
    <rect x="126" y="720" width="130" height="6" rx="3" opacity="0.11"/>
    <rect x="56" y="762" width="220" height="7" rx="3.5" opacity="0.08"/>
  </g>

  <!-- Reflection -->
  <g mask="url(#reflectMask)" opacity="0.2">
    <use href="#ship" transform="translate(360 614) scale(0.78 -0.55)"/>
  </g>

  <!-- Waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 522 Q380 518 460 522 T620 521" stroke="#e8a070" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="30 18 8 22"/>
    <path d="M-10 540 Q120 534 250 540" stroke="#e8a070" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="26 20"/>
    <path d="M280 560 Q400 552 520 560 T640 560" stroke="#9a6a78" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="44 26 14 30"/>
    <path d="M-20 590 Q100 580 220 590" stroke="#6a5a7a" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="50 30"/>
    <path d="M200 650 Q340 640 480 650 T760 650" stroke="#4a6488" stroke-opacity="0.32" stroke-width="2.5" stroke-dasharray="60 34 20 40"/>
    <path d="M-20 700 Q140 688 300 700 T620 700" stroke="#3c577c" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="80 40 24 50"/>
    <path d="M-20 760 Q160 746 340 760 T700 760" stroke="#2f4a6e" stroke-opacity="0.4" stroke-width="3.5" stroke-dasharray="100 50 30 60"/>
  </g>

  <!-- The ship -->
  <ellipse cx="365" cy="617" rx="160" ry="8" fill="#050a14" opacity="0.5"/>
  <use href="#ship" transform="translate(360 612) scale(0.78)"/>
  <path d="M204 614 Q250 608 300 613 Q360 606 420 613 Q470 608 530 612 L530 626 L204 626 Z" fill="url(#sea)"/>
  <g fill="none" stroke="#f6dcb8" stroke-linecap="round">
    <path d="M206 616 Q240 622 276 619" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M500 606 Q528 614 548 626" stroke-opacity="0.5" stroke-width="2.2"/>
    <path d="M466 619 Q520 627 574 629" stroke-opacity="0.3" stroke-width="1.6"/>
    <path d="M146 627 Q190 633 236 629" stroke-opacity="0.2" stroke-width="1.6"/>
  </g>

  <!-- Gulls -->
  <g fill="none" stroke="#1c1428" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 246 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M468 272 q5 -5 10 0 q5 -5 10 0" stroke-width="1.8"/>
    <path d="M268 230 q4 -4 8 0 q4 -4 8 0" stroke-width="1.5"/>
  </g>

  <rect width="600" height="800" fill="url(#vignette)"/>
</svg>
