<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Hop</title>

  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <div id="blocker">

    </div>
